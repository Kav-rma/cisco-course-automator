ice is communicating through a</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="31.725"><time datetime="00:31">00:31</time><span>completely different network.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="34.35"><time datetime="00:34">00:34</time><span>It is a much shorter range wireless network</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="38.36"><time datetime="00:38">00:38</time><span>than the cellular network, and it works</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="41.339"><time datetime="00:41">00:41</time><span>with different rules and different protocols.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="44.371"><time datetime="00:44">00:44</time><span>Wi-Fi is something you are probably the most familiar</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="47.28"><time datetime="00:47">00:47</time><span>because Wi-Fi is supported on</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="49.31"><time datetime="00:49">00:49</time><span>many different types of devices, including smartphones.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="52.978"><time datetime="00:52">00:52</time><span>When we are working on a Wi-Fi network</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="56.125"><time datetime="00:56">00:56</time><span>we are usually using that network to</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="59.531"><time datetime="00:59">00:59</time><span>communicate over the global internet.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="62.581"><time datetime="01:02">01:02</time><span>And lastly we have near field communications.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="66.061"><time datetime="01:06">01:06</time><span>Near field communications allow us to</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="68.992"><time datetime="01:08">01:08</time><span>send information over an extremely short distance.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="73.592"><time datetime="01:13">01:13</time><span>This is how you might use your cellphone</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="76.197"><time datetime="01:16">01:16</time><span>to pay for something, you know, in a grocery store</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="79.245"><time datetime="01:19">01:19</time><span>or a fast food restaurant.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="83.019"><time datetime="01:23">01:23</time><span>Basically all of these communications, protocols, rules</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="87.48"><time datetime="01:27">01:27</time><span>and frequencies are contained within the same device.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="92.4"><time datetime="01:32">01:32</time><span>As far as I'm concerned it's pretty amazing.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="95.109"><time datetime="01:35">01:35</time><span>Now there is one other thing that your cellphone does,</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="98.579"><time datetime="01:38">01:38</time><span>and that is, it is capable of receiving GPS signals.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="102.739"><time datetime="01:42">01:42</time><span>What's happening is your cellphone is actually</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="105.229"><time datetime="01:45">01:45</time><span>receiving signals from satellites that are</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="107.979"><time datetime="01:47">01:47</time><span>stationed all around the Earth.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="111.397"><time datetime="01:51">01:51</time><span>And they send signals down to the various devices</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="115.411"><time datetime="01:55">01:55</time><span>that have GPS capability.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="117.949"><time datetime="01:57">01:57</time><span>And when they do, your cellphone is able to figure out</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="121.378"><time datetime="02:01">02:01</time><span>where it is, usually within a few meters.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="125.421"><time datetime="02:05">02:05</time><span>All of these things may actually</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="127.172"><time datetime="02:07">02:07</time><span>be happening simultaneously.</span></li></ul></div></div></div></template></signed-url-transcript></div></div></template></media-view></div></div></div></template></block-view><block-view modelid="96092afb42e34e42b1f31a52e9e4a38b" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="block" style="width: 12.5%;"><template shadowroot="open"><div data-socialgoodpulse-id="96092afb42e34e42b1f31a52e9e4a38b" class="96092afb42e34e42b1f31a52e9e4a38b block background-color-white item-color-green "><div class="block__inner"><base-view type="block" modelid="96092afb42e34e42b1f31a52e9e4a38b" model="[object Object]" customclass="" lowercase_component="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="block__header-wrapper background-color-white item-color-green "><div class="block__header "><div class="block__header-inner "><div class="block__title "><heading-view aria-hidden="true" id="96092afb42e34e42b1f31a52e9e4a38b-heading-view" headingtitle="3.1.2 Video - Cell Phone Interactions with Different Networks" modelid="96092afb42e34e42b1f31a52e9e4a38b" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="js-heading is-incomplete"><div class="js-he nedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="33.318"><time datetime="00:33">00:33</time><span>So basically we use one of the radios within the cell phone,</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="38.932"><time datetime="00:38">00:38</time><span>and cell phones contain multiple radios,</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="41.252"><time datetime="00:41">00:41</time><span>transmitters, and receivers, to do the talking.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="44.44"><time datetime="00:44">00:44</time><span>Then we also do data.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="47.548"><time datetime="00:47">00:47</time><span>And this is the kind of data that we use our data plan for.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="54.036"><time datetime="00:54">00:54</time><span>This is when we're looking up something on our cell phone</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="56.006"><time datetime="00:56">00:56</time><span>when we're not near a regular Wi-Fi network.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="61.618"><time datetime="01:01">01:01</time><span>So we have the data plan network,</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="65.099"><time datetime="01:05">01:05</time><span>which uses the cell phone infrastructure</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="68.025"><time datetime="01:08">01:08</time><span>in order to be able to access the internet.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="70.905"><time datetime="01:10">01:10</time><span>We also have Wi-Fi.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="76.238"><time datetime="01:16">01:16</time><span>We use hotspots, and usually we also have</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="80.385"><time datetime="01:20">01:20</time><span>a home wireless network.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="88.985"><time datetime="01:28">01:28</time><span>Most of us also use our cell phones as a way to get places.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="94.738"><time datetime="01:34">01:34</time><span>We use location services.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="104.379"><time datetime="01:44">01:44</time><span>Location services include our GPS, maps, places near me,</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="119.012"><time datetime="01:59">01:59</time><span>and now many of us are also using our cell phones</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="121.562"><time datetime="02:01">02:01</time><span>to pay for things.</span></li><li class="vjs-signedTranscript-widget-content-container-cue" tabindex="0" aria-selected="false" data-cue-id="125.624"><time datetime="02:05">02:05</time><span>So we have pay services.</span></li><li cla
