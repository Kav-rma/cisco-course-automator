s="article__header-inner "></div></div></div></template></base-view><div class="block__container " style=""><block-view modelid="65edce2ec0a94151b3cece04847419d1" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="block" style="width: 33.3333%;"><template shadowroot="open"><div data-socialgoodpulse-id="65edce2ec0a94151b3cece04847419d1" class="65edce2ec0a94151b3cece04847419d1 block background-color-gray item-color-green "><div class="block__inner"><base-view type="block" modelid="65edce2ec0a94151b3cece04847419d1" model="[object Object]" customclass="" lowercase_component="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="block__header-wrapper background-color-gray item-color-green "><div class="block__header "><div class="block__header-inner "><div class="block__title "><heading-view aria-hidden="true" id="65edce2ec0a94151b3cece04847419d1-heading-view" headingtitle="3.3.1 What Did I Learn in this Module?" modelid="65edce2ec0a94151b3cece04847419d1" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="js-heading is-incomplete"><div class="js-heading-inner" role="heading" id="block-heading" aria-level="3"><span class="aria-label">Incomplete 3.3.1 What Did I Learn in this Module?</span></div></div></template></heading-view><div tabindex="0" role="heading" class="block__title-inner " aria-level="3"><span class="accessibility-completion-indicator">Incomplete </span>3.3.1 What Did I Learn in this Module?</div></div></div></div></div></template></base-view><div class="component__container"><accordion-view modelid="c58ceb3c44ad4ff3bbec71c921010f6d" class="is-full" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="component"><template shadowroot="open"><div class="component"><div class="accordion-inner component__inner"><div data-socialgoodpulse-id="c58ceb3c44ad4ff3bbec71c921010f6d" class="component accordion c58ceb3c44ad4ff3bbec71c921010f6d  is-full   "><div class="component__header-container"><div data-socialgoodpulse-id="c58ceb3c44ad4ff3bbec71c921010f6d" class="accordion "><base-view type="component" lowercase_component="accordion" model="[object Object]" customclass="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="component__header-wrapper  "><div class="component__header accordion__header"><div class="component__header-inner accordion__header-inner"><div class="component__content"><div tabindex="0" class="component__body accordion__body"><div class="component__body-inner accordion__body-inner"><p><strong>Click below to learn more about the different ways that smartphones make connections.</strong></p></div></div></div></div></div></div></template></base-view></div></div><div class="component__widget accordion__widget"><div class="accordion__item component__item " data-index="0"><button class="accordion__item-btn " aria-expanded="false" aria-controls="accordion-item-0" data-index="0"><div class="accordion__item-title"><div class="accordion__item-icon"><material-icon class="select-triangle" aria-hidden="true" icon="expand_less" customclasses="" iconname="expand_less" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><span part="material-icon" class="material-icons ">expand_less</span></template></material-icon></div><div class="accordion__item-title-inner">Wireless Networks</div></div></button><div role="region" class="accordion__item-body-inner hide_accordion" data-index="0" id="accordion-item-0"><div class="accordion__item-body-wrapper accordion__item-body-wrapper-0" inert="" aria-hidden="true"><div class="accordion__item-content accordion__item-content-0" tabindex="-1"><p>Mobile phones use radio waves to transmit voice signals to antennas mounted on towers located in specific geographic areas. When a telephone call is made, the voice signal is relayed from one tower to another tower until it is delivered to its destination. This type of network is used when you make a phone call to another mobile phone or to a wired telephone. It is also used to send text messages directly from the phone. The most common type of cellular telephone network is called a GSM network. The abbreviations 3G, 4G, 4G-LTE, and 5G are used to describe enhanced cell phone networks that are optimized for the fast transmission of data. Currently, 4G still dominates as the current mobile network used by most phones.</p><p>In addition to the GSM and 4G/5G transmitters and receivers, smartphones make connections in a variety of ways.</p><p>Wi-Fi transmitters and receivers located within the smartphone enable the phone to connect to local networks and the internet. Wi-Fi networks are usually privately owned but often provide guest or public access hotspots. A hotspot is an area where Wi-Fi signals are available.</p><p>Bluetooth is wireless technology that allows devices to communicate over short distances. Multiple devices can be connected at the same time with Bluetooth.</p><p>NFC is a wireless communication technology that enables data to be exchanged by devices that are in very close proximity to each other, usually less than a few centimeters.</p></div></div></div></div><div class="accordion__item component__item " data-index="1"><button class="accordion__item-btn " aria-expanded="false" aria-controls="accordion-item-1" data-index="1"><div class="accordion__item-title"><div class="accordion__item-icon"><material-icon class="select-triangle" aria-hidden="true" icon="expand_less" customclasses="" iconname="expand_less" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><span part="material-icon" class="material-icons ">expand_less</span></template></material-icon></div><div class="accordion__item-title-inner">Mobile Device Connectivity</div></div></button><div role="region" class="accordion__item-body-inner hide_accordion" data-index="1" id="accordion-item-1"><div class="accordion__item-body-wrapper accordion__item-body-wrapper-1" inert="" aria-hidden="true"><div class="accordion__item-content accordion__item-content-1" tabindex="-1"><p>Almost all mobile devices are capable of connecting to Wi-Fi networks. These precautions should be taken to protect Wi-Fi communications on mobile devices:</p><p></p><ul><li>Never send login or password information using unencrypted text (plaintext). </li><li>Use a VPN connection when possible if you are sending sensitive data.</li><li>Enable security on home networks.</li><li>Use WPA2 or higher encryption for security. </li></ul><p></p><p>Two of the most popular operating systems for mobile devices are Android and Apple iOS. Mobile devices are preprogrammed to use a Wi-Fi network for the internet if one is available, and the device can connect to the access point and receive an IP address. If no Wi-Fi network is available, the device uses the cellular data capability if it is configured.</p><p>Bluetooth technology provides a simple way for mobile devices to connect to each other and to wireless accessories. Bluetooth is wireless, automatic, and uses very little power, which helps conserve battery life. Some examples of devices that use Bluetooth include hands-free headsets, keyboards, a mouse, stereo controls, car speakerphones, and mobile speakers.</p><p>Bluetooth pairing occurs when two Bluetooth devices establish a connection to share resources. In order for the devices to pair, the Bluetooth radios are turned on, and one device begins searching for other devices. Other devices must be set to discoverable mode, also called visible, so that they can be detected.</p><p>When a Bluetooth device is in discoverable mode, it transmits the following information when another Bluetooth device requests it:</p><p></p><p></p><ul><li>Name</li><li>Bluetooth class</li><li>Services that the device can use</li><li>Technical information, such as the features or the Bluetooth specification that it supports </li></ul><p></p><p>During the pairing process, a PIN may be requested to authenticate the pairing process.</p></div></div></div></div></div></div></div></div></template></accordion-view></div></div></div></template></block-view><block-view modelid="1753436f9fdf4b58a829169c5a74e314" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="block" style="width: 33.3333%;"><template shadowroot="open"><div data-socialgoodpulse-id="1753436f9fdf4b58a829169c5a74e314" class="1753436f9fdf4b58a829169c5a74e314 block background-color-white is-complete"><div class="block__inner"><base-view type="block" modelid="1753436f9fdf4b58a829169c5a74e314" model="[object Object]" customclass="" lowercase_component="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="block__header-wrapper background-color-white "><div class="block__header "><div class="block__header-inner "><div class="block__title "><heading-view aria-h
