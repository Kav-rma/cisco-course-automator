w><div class="component__container"><text-view modelid="7d86e343298944ec9a3b43c3eb702d28" class="is-left background-colour1 remove-padding-top no-element-backgrounds" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="component"><template shadowroot="open"><div class="text-inner component__inner"><div class="component__header-container"><div data-socialgoodpulse-id="7d86e343298944ec9a3b43c3eb702d28" class="component text 7d86e343298944ec9a3b43c3eb702d28 background-colour1 remove-padding-top no-element-backgrounds is-left is-complete  "><base-view type="component" lowercase_component="text" model="[object Object]" customclass="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="component__header-wrapper background-colour1 remove-padding-top no-element-backgrounds "><div class="component__header text__header"><div class="component__header-inner text__header-inner"><div class="component__content"><div tabindex="0" class="component__body text__body"><div class="component__body-inner text__body-inner"><p>Kishori and Shridhar are washing the dishes after dinner. Kishori is watching a favorite movie on her tablet while putting the dishes away. She asks Shridhar if her tablet works exactly as her mobile phone does. He explains that there are some tablets that do use a mobile network, but that her tablet is works on Wi-Fi network in her house. She tells him that she knows it must come in from that box in the corner of the living room. That is all she knows!</p><p>Shridhar explains that the box in the corner is a home router. The router is connected to the internet. Home routers typically have two primary types of ports: ethernet ports and internet ports. In addition to the wired ports, many home routers include a radio antenna and a built-in wireless access point. Kishori mostly uses wireless at home. Now Shridhar is worried about his mother’s wireless security. Since she did not know what the router was, she probably did not change her default password on the router! Shridhar logs into the router and makes some changes to keep Kishori’s network and devices safer.</p><p>Have you ever set up a router? Have you thought about having secure communications over wireless devices? This module will give you the knowledge to build a home network and configure wireless devices for secure communication.</p></div></div></div></div></div></div></template></base-view></div></div></div></template></text-view><graphic-view modelid="0e6af314ac36471689c3196aa9808ab2" class="is-right" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="component"><template shadowroot="open"><div class="graphic-inner component__inner"><div data-socialgoodpulse-id="0e6af314ac36471689c3196aa9808ab2" class="component graphic 0e6af314ac36471689c3196aa9808ab2  is-right is-complete  "><div class="component__header-container"><base-view type="component" lowercase_component="graphic" model="[object Object]" customclass="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="component__header-wrapper  "><div class="component__header graphic__header"><div class="component__header-inner graphic__header-inner"></div></div></div></template></base-view></div><div class="component__widget"><div class="graphic__image-container "><img id="graphic__image" aria-hidden="false" tabindex="0" class="graphic__image js-graphic-set-image-src" src="./courses/ff9e491c-49be-4734-803e-a79e6e83dab1/395d598a-b984-52db-8c
