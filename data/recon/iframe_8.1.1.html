ew><div class="component__container"><adobe-animate-view modelid="d194c1ed4a914552962e473ae4b6d1cd" class="is-full undefined" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="component"><template shadowroot="open"><div data-socialgoodpulse-id="d194c1ed4a914552962e473ae4b6d1cd" class="component adobe-animate d194c1ed4a914552962e473ae4b6d1cd undefined is-undefined is-complete  "><div class="component__header-container"><base-view type="component" lowercase_component="adobe-animate" model="[object Object]" customclass="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="component__header-wrapper undefined "><div class="component__header adobe-animate__header"><div class="component__header-inner adobe-animate__header-inner"><div class="component__content"><div tabindex="0" class="component__body adobe-animate__body"><div class="component__body-inner adobe-animate__body-inner"><p>A host needs an IPv4 address to participate on the internet and almost all LANs today. The IPv4 address is a logical network address that identifies a particular host. It must be properly configured and unique within the LAN, for local communication. It must also be properly configured and unique in the world, for remote communication. This is how a host is able to communicate with other devices on the internet.</p><p>An IPv4 address is assigned to the network interface connection for a host. This connection is usually a network interface card (NIC) installed in the device. Examples of end-user devices with network interfaces include workstations, servers, network printers, and IP phones. Some servers can have more than one NIC and each of these has its own IPv4 address. Router interfaces that provide connections to an IP network will also have an IPv4 address.</p><p>Every packet sent across the internet has a source and destination IPv4 address. This information is required by networking devices to ensure the information gets to the destination and any replies are returned to the source.</p><p><strong>Click Play in the figure to see how packets travel across the internet.<strong></strong></strong></p></div></div></div></div></div></div></template></base-view></div><div class="component__widget"><div class="a11y_description screen-reader-hide" aria-live="polite" id="a11y_description-0743a950-e648-11ea-943d-3985b1606afe">This animation consists of a user sitting at a desktop p c with I P address 192.168.200.8 which is connected to the internet. The p c is sending packets to a remote web server, www.cisco.com, at IP address 192.168.5.100. Also connected to the internet cloud are two other servers, Business A at 172.16.30.5 and Business B at 10.5.105.50.</div><div dir="ltr" tabindex="0" role="figure" id="0743a950-e648-11ea-943d-3985b1606afe" class="0743a950-e648-11ea-943d-3985b1606afe adobe-animate-container" aria-labelledby="a11y_description-0743a950-e648-11ea-943d-3985b1606afe"><div class="spacer"><div class="canvas-text-wrapper"><canvas width="885" height="658"></canvas><div id="dynamic-text" dir="ltr" style="position: absolute; transform-origin: 0% 0%; visibility: visible; transform: matrix(1, 0, 0, 1, 0, 0); opacity: 1; width: 885px; height: 658px;"><div id="ID_txt02" class="ID_txt02" tabindex="-1" style="top: 0px; left: 0px; width: 122.45px; text-align: center; visibility: visible; position: absolute; transform-origin: 0% 0%; transform: matrix(1.3014, 0, 0, 1.3014, 383, 246); opacity: 1;">Internet</div><div id="ID_txt03" class="ID_txt03" tabindex="-1" style="top: 0px; left: 0px; width: 115px; text-align: center; visibility: visible; position: absolute; transform-origin: 0% 0%; transform: matrix(1.3014, 0, 0, 1.3014, 694, 35); opacity: 1;">WWW.CISCO.COM<br></ te item-color-green is-complete"><div class="block__inner"><base-view type="block" modelid="32cafd44e6614cbea29333cf25932c2f" model="[object Object]" customclass="" lowercase_component="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="block__header-wrapper background-color-white item-color-green "><div class="block__header "><div class="block__header-inner "><div class="block__title "><heading-view aria-hidden="true" id="32cafd44e6614cbea29333cf25932c2f-heading-view" headingtitle="8.1.2 Octets and Dotted-Decimal Notation" modelid="32cafd44e6614cbea29333cf25932c2f" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="js-heading is-complete"><div class="js-heading-inner" role="heading" id="block-heading" aria-level="3"><span class="aria-label">Complete 8.1.2 Octets and Dotted-Decimal Notation</span></div></div></template></heading-view><div tabindex="0" role="heading" class="block__title-inner " aria-level="3"><span class="accessibility-completion-indicator">Complete </span>8.1.2 Octets and Dotted-Decimal Notation</div></div></div></div></div></template></base-view><div class="component__container"><text-view modelid="d5cc3050e9d9415abf368b38e6690073" class="is-full background-colour1 remove-padding-top no-element-backgrounds" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="component"><template shadowroot="open"><div class="text-inner component__inner"><div class="component__header-container"><div data-socialgoodpulse-id="d5cc3050e9d9415abf368b38e6690073" class="component text d5cc3050e9d9415abf368b38e6690073 background-colour1 remove-padding-top no-element-backgrounds is-full is-complete  "><base-view type="component" lowercase_component="text" model="[object Object]" customclass="" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme"><template shadowroot="open"><div class="component__header-wrapper background-colour1 remove-padding-top no-element-backgrounds "><div class="component__header text__header"><div class="component__header-inner text__header-inner"><div class="component__content"><div tabindex="0" class="component__body text__body"><div class="component__body-inner text__body-inner"><p>IPv4 addresses are 32 bits in length. Here is an IPv4 address in binary:<br></br><strong>11010001101001011100100000000001</strong></p><p>Notice how difficult this address is to read. Imagine having to configure devices with a series of 32 bits! For this reason, the 32 bits are grouped into four 8-bit bytes called octets like this:<br></br><strong>11010001.10100101.11001000.00000001</strong></p><p>That's better, but still difficult to read. That's why we convert each octet into its decimal value, separated by a decimal point or period. The above binary IPv4 becomes this dotted-decimal representation:<br></br><strong>209.165.200.1</strong></p><p><strong>Note</strong>: For now, you do not need to know how to convert between binary and decimal number systems. </p></div></div></div></div></div></div></template></base-view></div></div></div></template></text-view></div></div></div></template></block-view><block-view modelid="8fbbce59db444dfe87415964bdd94d48" is-touch="false" fullscreen="true" device="large" browser="Chrome" os="windows" dir="ltr" location="page" theme="light" orientation="landscape" themetype="block-base-theme" sgpulse-type="block" style="width: 25%;"><template shadowroot="open"><div data-socialgoodpulse-id="8fbbce59db444dfe87415964bdd94d48" class="8f
